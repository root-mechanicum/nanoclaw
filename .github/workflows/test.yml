name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Covers BOTH tsconfigs (src/ and skills-engine/). Run the composite, not a
      # bare `tsc --noEmit`: the root tsconfig is include:["src/**/*"], so a bare
      # invocation is silent about skills-engine/ rather than green on it. Any
      # lane added to `typecheck` in package.json is picked up here for free.
      - run: npm run typecheck
      - run: npx vitest run
